<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarSheets</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link data-trunk rel="copy-file" href="favicon.svg" />
  <link data-trunk rel="copy-dir" href="webfonts" />
  <link data-trunk rel="copy-dir" href="dictionary" />
  <link data-trunk rel="rust" data-bin="starsheets" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f9fbfd; }
    #starsheets_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #starsheets_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #444746; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="starsheets_canvas"></canvas>
  <div id="starsheets_loading">Loading StarSheets&hellip;</div>
  <script>
    // Copying on plain http: the browser hides navigator.clipboard outside HTTPS, so eframe and
    // GridCraft can't copy. A page may still fill the clipboard during the browser's own copy/cut
    // event (Ctrl+C / Ctrl+X), and eframe runs the app inside that event, so the app hands its
    // text to window.__ssCopy, which puts it in the event. Outside a copy event (a menu click) it
    // tries document.execCommand('copy'), which browsers allow only shortly after a click or key.
    // Leaving while a change isn't saved yet: the browser asks first (files.rs sets the flag).
    window.__ssUnsaved = false;
    // Closing the tab with a change not yet saved: ask the app to save now (and keep the browser's
    // "Leave page?" question so there is time). Hiding the tab saves at once too.
    window.__ssFlushNow = false;
    window.addEventListener('beforeunload', (e) => { if (window.__ssUnsaved) { window.__ssFlushNow = true; e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && window.__ssUnsaved) window.__ssFlushNow = true; });
    window.__ssCopyEvent = null;
    for (const t of ['copy', 'cut']) {
      window.addEventListener(t, (e) => {
        window.__ssCopyEvent = e;
        setTimeout(() => { window.__ssCopyEvent = null; }, 0);
      }, true);
    }
    window.__ssCopy = function (text, html) {
      const fill = (e) => {
        e.clipboardData.setData('text/plain', text);
        if (html) e.clipboardData.setData('text/html', html);
        e.preventDefault();
      };
      const now = window.__ssCopyEvent;
      if (now && now.clipboardData) { fill(now); return true; }
      // Our own copy event must not reach eframe (it would run the app again).
      const once = (e) => { fill(e); e.stopImmediatePropagation(); };
      window.addEventListener('copy', once, true);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      window.removeEventListener('copy', once, true);
      return ok;
    };
    // Sheets shortcuts that Firefox/Chrome also use (Ctrl+D bookmark, Ctrl+B sidebar, Ctrl+U
    // source…): stop the browser's action; StarSheets still gets the key.
    // Ctrl+Shift+R is left to the browser (hard reload; owner's choice over Sheets' align right).
    // Copy/cut/paste and tab/window keys (C X V W T N Tab) are left alone.
    (function () {
      var plain = "bdfghikoprsuyz", shifted = "acdeflvz1234567";
      window.addEventListener("keydown", function (e) {
        if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
        var k = (e.key || "").toLowerCase();
        if (e.shiftKey && e.code && /^Digit[1-7]$/.test(e.code)) k = e.code.slice(5);
        if (k.length === 1 && (e.shiftKey ? shifted : plain).indexOf(k) >= 0) e.preventDefault();
      }, true);
    })();
  </script>
</body>
</html>
