# Builds the web app on every push and pull request. The built site is kept as the
# `starsheets-web` artifact; the server pulls the latest one from main (docs/deploy.md).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.2

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GridCraft at the pinned tag and apply our patches
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin trunk
          trunk --version
      - name: Fetch web fonts (Google Fonts, OFL/Apache)
        run: python3 scripts/fetch-fonts.py
      - name: Build
        working-directory: app
        run: trunk build --release
      - name: Record build info
        run: |
          printf '{"commit":"%s","upstream":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(sed -n 's/^tag = "\(.*\)"/\1/p' upstream.pin)" "$(date -u +%FT%TZ)" > dist/build.json
          du -sh dist; ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: starsheets-web
          path: dist/
          retention-days: 30

  test:
    name: Tests (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GridCraft at the pinned tag and apply our patches
        run: scripts/fetch-upstream.sh
      - name: System libraries for egui's native backends
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Test
        run: cargo test -p starsheets
