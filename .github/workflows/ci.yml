# Builds the web app on every push and pull request. The built site is kept as the
# `starsheets-web` artifact; a self-hosted server can pull the latest one from main
# (docs/deploy.md). A version tag (vX.Y.Z) also publishes the Docker image and drafts a release.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.2

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GridCraft at the pinned tag and apply our patches
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin trunk
          trunk --version
      - name: Fetch web fonts (Google Fonts, OFL/Apache)
        run: python3 scripts/fetch-fonts.py
      - name: Build
        working-directory: app
        run: trunk build --release
      - name: Record build info
        run: |
          printf '{"commit":"%s","upstream":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(sed -n 's/^tag = "\(.*\)"/\1/p' upstream.pin)" "$(date -u +%FT%TZ)" > dist/build.json
          du -sh dist; ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: starsheets-web
          path: dist/
          retention-days: 30

  test:
    name: Tests (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GridCraft at the pinned tag and apply our patches
        run: scripts/fetch-upstream.sh
      - name: System libraries for egui's native backends
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Test
        run: cargo test -p starsheets -p sheets-functions

  release:
    name: Release (Docker image + draft release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match the version in Cargo.toml
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: starsheets-web
          path: site
      - name: Compress the site (served pre-compressed) and zip it for the release
        run: |
          (cd site && zip -qr "../starsheets-web-$VERSION.zip" .)
          find site -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' -o -name '*.json' \) -exec gzip -k -9 {} \;
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/domeshifter/starsheets:${{ env.VERSION }}
            ghcr.io/domeshifter/starsheets:latest
          labels: |
            org.opencontainers.image.source=https://github.com/DomeShifter/StarSheets
            org.opencontainers.image.description=A spreadsheet that looks and feels like Google Sheets, that you can run yourself.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - name: Draft the release (notes from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\n---\n**Docker:** `docker run -p 8080:8080 -v starsheets:/data ghcr.io/domeshifter/starsheets:%s` (see docker/compose.yml)\n' "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "StarSheets $VERSION" --notes-file notes.md "starsheets-web-$VERSION.zip"

